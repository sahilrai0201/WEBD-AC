<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Me</title>
</head>

<body>

    <header>

        <center>

            <h1>📞 Contact Me</h1>

            <p>
                Feel free to connect with me
            </p>

        </center>

        <hr>

        <nav>

            <center>

                <a href="./index.html">Home</a> |
                <a href="./education.html">Education</a> |
                <a href="./experience.html">Experience</a> |
                <a href="./projects.html">Projects</a>

            </center>

        </nav>

        <hr>

    </header>

    <main>

        <section>

            <h2>📝 Send Me a Message</h2>

            <form>

                <label for="name">
                    Full Name:
                </label>

                <br><br>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your name"
                    required
                >

                <br><br>

                <label for="email">
                    Email:
                </label>

                <br><br>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

                <br><br>

                <label for="subject">
                    Subject:
                </label>

                <br><br>

                <select id="subject">

                    <option>Project Discussion</option>
                    <option>Internship Opportunity</option>
                    <option>Collaboration</option>
                    <option>Other</option>

                </select>

                <br><br>

                <label for="message">
                    Message:
                </label>

                <br><br>

                <textarea
                    id="message"
                    rows="6"
                    cols="40"
                    placeholder="Write your message here..."
                ></textarea>

                <br><br>

                <p>
                    How did you find my portfolio?
                </p>

                <input type="radio" id="linkedin" name="source">

                <label for="linkedin">
                    LinkedIn
                </label>

                <br>

                <input type="radio" id="github" name="source">

                <label for="github">
                    GitHub
                </label>

                <br>

                <input type="radio" id="friend" name="source">

                <label for="friend">
                    Friend
                </label>

                <br><br>

                <input type="checkbox" id="updates">

                <label for="updates">
                    Send me future updates
                </label>

                <br><br>

                <button type="submit">
                    Submit
                </button>

                <button type="reset">
                    Reset
                </button>

            </form>

        </section>

        <hr>

        <section>

            <h2>🔗 Connect Directly</h2>

            <table border="1" cellpadding="10">

                <tr>
                    <th>Platform</th>
                    <th>Link</th>
                </tr>

                <tr>
                    <td>Email</td>
                    <td>example@gmail.com</td>
                </tr>

                <tr>
                    <td>GitHub</td>
                    <td>
                        <a href="https://github.com/" target="_blank">
                            Visit GitHub
                        </a>
                    </td>
                </tr>

                <tr>
                    <td>LinkedIn</td>
                    <td>
                        <a href="https://linkedin.com/" target="_blank">
                            Visit LinkedIn
                        </a>
                    </td>
                </tr>

            </table>

        </section>

    </main>

    <hr>

    <footer>

        <center>

            <p>
                Thanks For Visiting My Portfolio 🚀
            </p>

        </center>

    </footer>

</body>

</html>

    <h3>Registration Form</h3>
    <form action="/action.php">
        <input type="text" placeholder="Enter Name">
        <br> <br>
        <input type="password" placeholder="Password">

        <br> <br>
        <h4>Select Your Class : </h4>
        <label for="101">
            <input type="radio" value="Class XI" name="class" id="101">Class XI
        </label>
        <label for="102">
            <input type="radio" value="Class XII" name="class" id="102">Class XII
        </label>
        <br> <br>


        <h4>Select Your Subjects : </h4>
        <label for="Maths">
            <input type="checkbox" value="Maths" name="subject" id="101">Maths
        </label>
        <label for="Physics">
            <input type="checkbox" value="Physics" name="subject" id="102">Phyiscs
        </label>
        <label for="Chemistry">
            <input type="checkbox" value="Chemistry" name="subject" id="103">Chemistry
        </label>
        <label for="English">
            <input type="checkbox" value="English" name="subject" id="104">English
        </label>
        <label for="Computer Science">
            <input type="checkbox" value="Computer Science" name="subject" id="105">Computer Science
        </label>
        <label for="History">
            <input type="checkbox" value="History" name="subject" id="106">History
        </label>
        <label for="Physical">
            <input type="checkbox" value="Physical" name="subject" id="107">Physical
        </label>
        <br> <br>

        <h4>Select Your City : </h4>
        <select name="city" id="111">
            <option value="delhi"> Delhi </option>
            <option value="mumbai"> Mumbai </option>
            <option value="banglore"> Banglore </option>
            <option value="pune"> Pune </option>
        </select>

        <br> <br>
        <h4>Feedback : </h4>
        <textarea name="feedback" id="101" placeholder="Give your feedback" rows="5"></textarea>

        <br> <br>
        <input type="submit" value="submit">

    </form>
